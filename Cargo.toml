[workspace]
resolver = "2"
members = ["core", "server", "desktop"]
default-members = ["core", "server", "desktop"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
