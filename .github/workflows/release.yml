name: Release (Windows .exe + Android .apk)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@^2 build --bundles nsis msi
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          cp target/release/bundle/nsis/*.exe "dist/TetikAim-${TAG}-setup.exe"
          cp target/release/bundle/msi/*.msi "dist/TetikAim-${TAG}.msi"
          cp target/release/tetik-desktop.exe "dist/TetikAim-${TAG}-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@^2 android build --apk --ci
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASSWORD"
          else
            # No signing key configured: sign with a throwaway key. Installs fine,
            # but a later APK signed with another key cannot update it in place.
            echo "::warning::ANDROID_KEYSTORE_B64 not set, signing with a temporary key"
            PASS=temporary
            keytool -genkeypair -keystore release.jks -storepass "$PASS" -keypass "$PASS" -alias tetik \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Tetik Aim"
          fi
          APK=$(ls desktop/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          mkdir dist
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --out "dist/TetikAim-${TAG}.apk" aligned.apk
          "$BT/apksigner" verify "dist/TetikAim-${TAG}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Tetik Aim ${{ env.TAG }}
          files: dist/*
          body: |
            **İndir**
            - Windows: `TetikAim-${{ env.TAG }}-setup.exe` (kurulum) veya `TetikAim-${{ env.TAG }}-portable.exe` (kurulumsuz, WebView2 gerekir; Windows 10/11'de hazır gelir)
            - Android: `TetikAim-${{ env.TAG }}.apk` (telefonda "bilinmeyen kaynaklara izin ver" gerekebilir)

            Tarayıcıda oynamak için repo açıklamasındaki GitHub Pages bağlantısını kullan.
